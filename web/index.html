<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>Bolt</title>
  <meta name="description" content="Gym coaching and workout tracking.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B09">

  <!-- Opens full screen from the iPhone home screen, under a see-through status bar. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolt">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0B09; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash svg { width: 72px; height: 72px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M13,2L3,14H12L11,22L21,10H12L13,2Z" fill="#C6FF1A"/></svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash').remove());
    // Keeps Bolt working with no signal. Written by tool/build_web.dart.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
