<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>Bolt</title>
  <meta name="description" content="Gym coaching and workout tracking.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B09">

  <!-- Opens full screen from the iPhone home screen, under a see-through status bar. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolt">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0B09; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash svg { width: 72px; height: 72px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M13,2L3,14H12L11,22L21,10H12L13,2Z" fill="#C6FF1A"/></svg>
  </div>
  <script>
    // Without a share sheet the share library must fall back to a download.
    navigator.canShare ??= () => false;
    // Android offers to install before Flutter is running, so it is kept here.
    let installOffer = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installOffer = e;
      window.dispatchEvent(new Event('boltcaninstall'));
    });
    window.boltCanInstall = () => installOffer !== null;
    window.boltInstall = async () => {
      if (!installOffer) return false;
      installOffer.prompt();
      return (await installOffer.userChoice).outcome === 'accepted';
    };
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash').remove());
    // Keeps Bolt working with no signal. Written by tool/build_web.dart.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
